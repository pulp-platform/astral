  pad_type: PAD_OUTPUT_V
  is_static: true
  connections:
    chip2pad: spih_sck_o
    output_en: 1'b1

- name: spih_csb
  description: "SPI csb"
  pad_type: PAD_OUTPUT_V
  is_static: true
  connections:
    chip2pad: spih_csb_o_1
    output_en: 1'b1

- name: spih_sd_{i}
